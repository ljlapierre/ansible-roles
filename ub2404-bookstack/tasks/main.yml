---
- name: install mariadb-server
  ansible.builtin.apt:
    name: mariadb-server
  notify: secure mariadb

- name: install prerequisites
  ansible.builtin.apt:
    name:
      - apache2
      - composer
      - git
      - libapache2-mod-php
      - memcached
      - php
      - php-curl
      - php-fpm
      - php-gd
      - php-ldap
      - php-memcached
      - php-mbstring
      - php-mysql
      - php-xml
      - php-zip
      - unzip
      - weasyprint

# Uncomment below and comment the composer package above if the version of composer in your distro is below the required version in bookstack
# See: https://www.bookstackapp.com/docs/admin/installation/#requirements

# - name: ensure system composer package is absent
#   ansible.builtin.apt:
#     name: composer
#     state: absent

# - name: download composer installer
#   ansible.builtin.get_url:
#     url: https://getcomposer.org/installer
#     dest: /usr/local/src/composer-installer
#   notify: install composer

- name: flush handlers
  ansible.builtin.meta: flush_handlers

- name: enable rewrite apache module
  community.general.apache2_module:
    name: rewrite
    state: present
  notify: restart apache

- name: configure apache for bookstack
  ansible.builtin.template:
    src: apache.conf
    dest: /etc/apache2/sites-available/bookstack.conf
  notify: restart apache

- name: disable the default apache site
  ansible.builtin.command: a2dissite 000-default.conf
  args:
    removes: /etc/apache2/sites-enabled/000-default.conf
  notify: restart apache

- name: enable the bookstack apache site
  ansible.builtin.command: a2ensite bookstack.conf
  args:
    creates: /etc/apache2/sites-enabled/bookstack.conf
  notify: restart apache

- name: download bookstack
  ansible.builtin.git:
    repo: 'https://github.com/BookStackApp/BookStack.git'
    dest: /var/www/bookstack
    version: release
    single_branch: true
  notify: upgrade bookstack
  tags: update

- name: set apache-writable folder permissions
  ansible.builtin.file:
    path: /var/www/bookstack/{{ item }}
    state: directory
    owner: www-data
    group: www-data
    recurse: yes
  loop:
    - bootstrap/cache
    - public/uploads
    - storage

- name: open firewall to load balancer
  community.general.ufw:
    rule: allow
    from_ip: '{{ ufw_fromip }}'
    name: Apache
  when: 'ufw_fromip is defined'
